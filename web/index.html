<!DOCTYPE html>
<html>
    <head>
        <title>tardis-lights demo</title>
        <style>
            :root {
                --light_on_color: rgb(154, 165, 255);
                --light_off_color: rgb(186, 186, 186);
                --light_top_color: rgb(134, 134, 134);
                --light_border_color: rgb(155, 155, 155);
            }
            .light {
                border-radius: 49%;
                width: 60px;
                height: 60px;
            }
            .lightOn {
                background-image: linear-gradient(
                    to bottom,
                    var(--light_top_color) 0%,
                    var(--light_top_color) 45%,
                    var(--light_on_color) 65%,
                    var(--light_on_color) 100%
                );
            }
            .lightOff {
                background-image: linear-gradient(
                    to bottom,
                    var(--light_top_color) 0%,
                    var(--light_top_color) 45%,
                    var(--light_off_color) 65%,
                    var(--light_off_color) 100%
                );
            }
            .lightFuck {
                width: 15px;
                height: 15px;
                border-radius: 50%;
                margin-left: 3px;
                margin-right: 3px;
                background: white;
                position: center;
            }
            .lightBorder {
                background-color: var(--light_border_color);
                padding-top: 20px;
                padding-bottom: 20px;
                width: 110px;
                height: 67px;
                border-radius: 50%;
            }
            .switch {
                display: none;
                cursor: pointer;
            }
            .switch_label {
                display: inline-block;
                width: 128px;
                height: 128px;
                cursor: pointer;
                background-size: cover;
                background-image: url("switch_down.png");
            }
            .switch:checked + .switch_label {
                background-image: url("switch_up.png");
            }
            html, body {
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background: coral;
            }
        </style>
        <script>
            setTimeout(() => {
                document.getElementById("light_1").className = "lightOn light"
            }, 2000);
        </script>
    </head>
    <body>
        <h1 style="text-align: center;"">TARDIS Lights Puzzle Simulator</h1>
        <div style="display: flex; justify-content: center;">
            <div>
                <div class="lightBorder", style="display: flex; justify-content: center; align-items: center;">
                    <div class="lightFuck"></div>
                    <div class="lightOff light", id="light_0"></div>
                    <div class="lightFuck"></div>
                </div>
            </div>
            <div>
                <div class="lightBorder", style="display: flex; justify-content: center; align-items: center;">
                    <div class="lightFuck"></div>
                    <div class="lightOff light", id="light_0"></div>
                    <div class="lightFuck"></div>
                </div>
            </div>
            <div>
                <div class="lightBorder", style="display: flex; justify-content: center; align-items: center;">
                    <div class="lightFuck"></div>
                    <div class="lightOff light", id="light_0"></div>
                    <div class="lightFuck"></div>
                </div>
            </div>
            <div>
                <div class="lightBorder", style="display: flex; justify-content: center; align-items: center;">
                    <div class="lightFuck"></div>
                    <div class="lightOff light", id="light_0"></div>
                    <div class="lightFuck"></div>
                </div>
            </div>
            <div>
                <div class="lightBorder", style="display: flex; justify-content: center; align-items: center;">
                    <div class="lightFuck"></div>
                    <div class="lightOff light", id="light_0"></div>
                    <div class="lightFuck"></div>
                </div>
            </div>
            <div>
                <div class="lightBorder", style="display: flex; justify-content: center; align-items: center;">
                    <div class="lightFuck"></div>
                    <div class="lightOff light", id="light_0"></div>
                    <div class="lightFuck"></div>
                </div>
            </div>
        </div>
        <div style="display: flex;  justify-content: center;">
            <input class="switch" type="checkbox" id="switch_1">
            <label for="switch_1" class="switch_label"></label>
            <input class="switch" type="checkbox" id="switch_2">
            <label for="switch_2" class="switch_label"></label>
            <input class="switch" type="checkbox" id="switch_3">
            <label for="switch_3" class="switch_label"></label>
            <input class="switch" type="checkbox" id="switch_4">
            <label for="switch_4" class="switch_label"></label>
            <input class="switch" type="checkbox" id="switch_5">
            <label for="switch_5" class="switch_label"></label>
        </div>
    </body>
</html>
